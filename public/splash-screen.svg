<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.1">
    <line x1="0" y1="270" x2="1920" y2="270" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#64748b" stroke-width="1"/>
    <line x1="0" y1="810" x2="1920" y2="810" stroke="#64748b" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="1080" stroke="#64748b" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="1080" stroke="#64748b" stroke-width="1"/>
    <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Decorative Network Nodes (Background) -->
  <g opacity="0.3">
    <!-- Node connections -->
    <line x1="300" y1="200" x2="500" y2="300" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="500" y1="300" x2="700" y2="250" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="1220" y1="200" x2="1420" y2="300" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="1420" y1="300" x2="1620" y2="250" stroke="url(#accentGradient)" stroke-width="2" stroke-dasharray="5,5"/>
    
    <!-- Nodes -->
    <circle cx="300" cy="200" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="500" cy="300" r="30" fill="#1e293b" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="700" cy="250" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="1220" cy="200" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="1420" cy="300" r="30" fill="#1e293b" stroke="#8b5cf6" stroke-width="3"/>
    <circle cx="1620" cy="250" r="30" fill="#1e293b" stroke="#3b82f6" stroke-width="3"/>
  </g>
  
  <!-- Main Icon/Logo (Centered) -->
  <g transform="translate(960, 380)">
    <!-- Mainframe Icon -->
    <rect x="-80" y="-60" width="160" height="120" rx="8" fill="#1e293b" stroke="url(#accentGradient)" stroke-width="4" filter="url(#glow)"/>
    <rect x="-70" y="-50" width="140" height="20" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="-70" y="-20" width="140" height="20" rx="4" fill="#8b5cf6" opacity="0.8"/>
    <rect x="-70" y="10" width="140" height="20" rx="4" fill="#3b82f6" opacity="0.8"/>
    <rect x="-70" y="40" width="140" height="10" rx="2" fill="#64748b" opacity="0.6"/>
    
    <!-- Arrow pointing right (modernization) -->
    <g transform="translate(120, 0)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="url(#accentGradient)" stroke-width="6" stroke-linecap="round"/>
      <polygon points="60,-15 90,0 60,15" fill="url(#accentGradient)"/>
    </g>
    
    <!-- Modern Cloud Icon -->
    <g transform="translate(220, 0)">
      <ellipse cx="0" cy="-10" rx="35" ry="25" fill="#3b82f6" opacity="0.9"/>
      <ellipse cx="25" cy="0" rx="40" ry="30" fill="#8b5cf6" opacity="0.9"/>
      <ellipse cx="-20" cy="5" rx="30" ry="25" fill="#3b82f6" opacity="0.9"/>
      <rect x="-50" y="5" width="100" height="30" fill="#1e293b"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="960" y="600" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Mainframe Modernization
  </text>
  <text x="960" y="670" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    Organizer
  </text>
  
  <!-- Subtitle -->
  <text x="960" y="740" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle">
    Visual Planning for Legacy System Transformation
  </text>
  
  <!-- Feature Badges -->
  <g transform="translate(960, 820)">
    <!-- Badge 1 -->
    <g transform="translate(-200, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="600">
        Interactive Canvas
      </text>
    </g>
    
    <!-- Badge 2 -->
    <g transform="translate(0, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#8b5cf6" text-anchor="middle" font-weight="600">
        As-Is / To-Be Views
      </text>
    </g>
    
    <!-- Badge 3 -->
    <g transform="translate(200, 0)">
      <rect x="-70" y="-20" width="140" height="40" rx="20" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="16" fill="#3b82f6" text-anchor="middle" font-weight="600">
        Real-time Tracking
      </text>
    </g>
  </g>
  
  <!-- Bottom tagline -->
  <text x="960" y="980" font-family="Arial, sans-serif" font-size="24" fill="#64748b" text-anchor="middle" font-style="italic">
    Made with Bob 🤖
  </text>
  
  <!-- Decorative corner elements -->
  <g opacity="0.2">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#3b82f6" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#3b82f6" stroke-width="4"/>
    
    <line x1="1920" y1="0" x2="1820" y2="0" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="1920" y1="0" x2="1920" y2="100" stroke="#8b5cf6" stroke-width="4"/>
    
    <line x1="0" y1="1080" x2="100" y2="1080" stroke="#3b82f6" stroke-width="4"/>
    <line x1="0" y1="1080" x2="0" y2="980" stroke="#3b82f6" stroke-width="4"/>
    
    <line x1="1920" y1="1080" x2="1820" y2="1080" stroke="#8b5cf6" stroke-width="4"/>
    <line x1="1920" y1="1080" x2="1920" y2="980" stroke="#8b5cf6" stroke-width="4"/>
  </g>
</svg>

<!-- Made with Bob -->
